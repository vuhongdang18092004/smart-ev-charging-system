spring:
  application:
    name: backend

  messages:
    basename: text/messages

  jackson:
    property-naming-strategy: SNAKE_CASE

  data:
    web:
      pageable:
        max-page-size: 100

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

dotenv:
  enabled: true
  directory: ./
  filename: .env

app:
  cors:
    allowed-origins: "${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}"
